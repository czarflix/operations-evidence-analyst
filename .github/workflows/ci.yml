name: offline-evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q tests
      - run: PYTHONPATH=. python evaluation/run_evaluation.py
